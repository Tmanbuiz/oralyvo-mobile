name: iOS signing configuration
on:
  push:
    branches: [main]
    paths: ['scripts/ios_signing.py', 'scripts/tests/**', 'codemagic.yaml', '.github/workflows/signing-config.yml']
  pull_request:
    paths: ['scripts/ios_signing.py', 'scripts/tests/**', 'codemagic.yaml', '.github/workflows/signing-config.yml']
permissions:
  contents: read
jobs:
  configuration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts/tests -v
