name: Android build

# Runs on GitHub's free hosted Linux runners -- GitHub Free includes 2,000
# Actions minutes/month for private repos, Linux minutes counted at 1x, so
# this costs nothing. (Codemagic's free plan only covers macOS minutes;
# Linux/Windows builds there are paid-only, which is why Android now builds
# here instead and codemagic.yaml keeps just the iOS workflows.)

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests, lint and debug APK
        working-directory: android
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oralyvo-android-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.html

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: oralyvo-android-debug
          path: android/app/build/outputs/apk/debug/*.apk

  bundle-release:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode release keystore
        working-directory: android
        env:
          ORALYVO_KEYSTORE_BASE64: ${{ secrets.ORALYVO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ORALYVO_KEYSTORE_BASE64" ]; then
            echo "$ORALYVO_KEYSTORE_BASE64" | base64 -d > app/oralyvo-upload.jks
            echo "ORALYVO_KEYSTORE_PATH=$(pwd)/app/oralyvo-upload.jks" >> "$GITHUB_ENV"
          else
            echo "No ORALYVO_KEYSTORE_BASE64 secret set; skipping release signing."
          fi

      - name: Bundle release AAB
        working-directory: android
        env:
          ORALYVO_KEYSTORE_PASSWORD: ${{ secrets.ORALYVO_KEYSTORE_PASSWORD }}
          ORALYVO_KEY_ALIAS: ${{ secrets.ORALYVO_KEY_ALIAS }}
          ORALYVO_KEY_PASSWORD: ${{ secrets.ORALYVO_KEY_PASSWORD }}
        run: gradle :app:bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: oralyvo-android-release-aab
          path: android/app/build/outputs/bundle/release/*.aab

  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch and account-storage smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          working-directory: android
          script: gradle :app:connectedDebugAndroidTest --no-daemon
      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oralyvo-android-device-reports
          path: android/app/build/reports/androidTests/
