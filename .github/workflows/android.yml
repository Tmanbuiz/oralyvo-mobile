name: Android build

# Runs on GitHub's free hosted Linux runners -- GitHub Free includes 2,000
# Actions minutes/month for private repos, Linux minutes counted at 1x, so
# this costs nothing. (Codemagic's free plan only covers macOS minutes;
# Linux/Windows builds there are paid-only, which is why Android now builds
# here instead and codemagic.yaml keeps just the iOS workflows.)

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
  workflow_dispatch: {}

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: oralyvo-android-debug
          path: android/app/build/outputs/apk/debug/*.apk

  bundle-release:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode release keystore
        working-directory: android
        env:
          ORALYVO_KEYSTORE_BASE64: ${{ secrets.ORALYVO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ORALYVO_KEYSTORE_BASE64" ]; then
            echo "$ORALYVO_KEYSTORE_BASE64" | base64 -d > app/oralyvo-upload.jks
            echo "ORALYVO_KEYSTORE_PATH=$(pwd)/app/oralyvo-upload.jks" >> "$GITHUB_ENV"
          else
            echo "No ORALYVO_KEYSTORE_BASE64 secret set; skipping release signing."
          fi

      - name: Bundle release AAB
        working-directory: android
        env:
          ORALYVO_KEYSTORE_PASSWORD: ${{ secrets.ORALYVO_KEYSTORE_PASSWORD }}
          ORALYVO_KEY_ALIAS: ${{ secrets.ORALYVO_KEY_ALIAS }}
          ORALYVO_KEY_PASSWORD: ${{ secrets.ORALYVO_KEY_PASSWORD }}
        run: gradle :app:bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: oralyvo-android-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
