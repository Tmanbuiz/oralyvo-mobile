# Codemagic CI -- builds the iOS app on a macOS runner so it compiles
# without a Mac being required anywhere. The Android build lives in
# .github/workflows/android.yml instead: Codemagic's free plan only
# includes macOS minutes (Linux/Windows builds there are paid-only), while
# GitHub Free gives 2,000 free Actions minutes/month on Linux for private
# repos, so Android builds there at no cost.
#
# Simulator builds are unsigned. The manual TestFlight workflow imports
# signing assets, validates a matching profile/identity pair, then uses the
# same explicit signing configuration for archive and export.

workflows:
  ios-dev-build:
    name: iOS - dev build (simulator, unsigned)
    max_build_duration: 45
    instance_type: mac_mini_m2
    working_directory: ios
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          xcodegen generate
      - name: Build for Simulator (no signing needed)
        script: |
          xcodebuild build \
            -project OralyvoApp.xcodeproj \
            -scheme OralyvoApp \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO

  ios-testflight:
    name: iOS - signed build to TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: ios
    # Manual start only (Codemagic UI) so every push doesn't upload a build.
    # Uses the App Store Connect API key integration named "codemagic".
    integrations:
      app_store_connect: codemagic
    environment:
      groups:
        - oralyvo_ios
      xcode: latest
      vars:
        BUNDLE_ID: app.oralyvo.mobile
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Set build number
        script: |
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"$BUILD_NUMBER\"/" project.yml
      - name: Generate placeholder app icon
        script: |
          mkdir -p OralyvoApp/Assets.xcassets/AppIcon.appiconset
          echo '{"info":{"author":"xcode","version":1}}' > OralyvoApp/Assets.xcassets/Contents.json
          echo '{"images":[{"filename":"icon-1024.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > OralyvoApp/Assets.xcassets/AppIcon.appiconset/Contents.json
          python3 - <<'PY'
          import zlib, struct
          n = 1024
          c = n / 2
          rows = []
          for y in range(n):
              row = bytearray([0])
              for x in range(n):
                  if (x - c) ** 2 + (y - c) ** 2 < 300 ** 2:
                      row += bytes((255, 255, 255))
                  else:
                      row += bytes((79, 70, 229))
              rows.append(bytes(row))
          def chunk(t, d):
              return struct.pack('>I', len(d)) + t + d + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
          png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', n, n, 8, 2, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(b''.join(rows), 9)) + chunk(b'IEND', b'')
          open('OralyvoApp/Assets.xcassets/AppIcon.appiconset/icon-1024.png', 'wb').write(png)
          PY
      - name: Generate Xcode project
        script: |
          xcodegen generate
      - name: Set up code signing
        script: |
          set -euo pipefail
          umask 077
          signing_key="$HOME/oralyvo_cert_key"
          trap 'rm -f "$signing_key" "$signing_key.pub"' EXIT
          if [ -n "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            printf '%s' "$CERTIFICATE_PRIVATE_KEY" > "$signing_key"
          else
            ssh-keygen -t rsa -b 2048 -m PEM -f "$signing_key" -N "" -q
          fi
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create --certificate-key "@file:$signing_key"
          keychain add-certificates
          python3 ../scripts/ios_signing.py --bundle-id "$BUNDLE_ID" --output build/signing
      - name: Build signed IPA
        script: |
          set -euo pipefail
          xcodebuild archive \
            -project OralyvoApp.xcodeproj -scheme OralyvoApp \
            -configuration Release -destination "generic/platform=iOS" \
            -archivePath build/ios/OralyvoApp.xcarchive \
            -xcconfig build/signing/signing.xcconfig
          xcodebuild -exportArchive \
            -archivePath build/ios/OralyvoApp.xcarchive \
            -exportOptionsPlist build/signing/export_options.plist \
            -exportPath build/ios/ipa
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
