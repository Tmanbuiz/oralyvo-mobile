<!DOCTYPE html>
<!--
  Loaded into a WebView (see ui/TurnstileWebView.kt) purely to render the
  Cloudflare Turnstile challenge and hand the resulting token back to Kotlin
  -- there is no native Turnstile SDK, so a WebView bridge is the standard
  workaround. Site key is the public Turnstile site key for oralyvo.app
  (safe to ship in the app; it is not a secret, only the server-side secret
  key is). The token this produces is sent to POST /api/auth/signin or
  /api/auth/signup alongside the email/password -- see data/ApiClient.kt.
-->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 80px;
  }
</style>
</head>
<body>
<div class="cf-turnstile"
     data-sitekey="0x4AAAAAAEYajqOVakuY7btN"
     data-callback="onTurnstileSuccess"
     data-error-callback="onTurnstileError"
     data-expired-callback="onTurnstileExpired"></div>
<script>
  function onTurnstileSuccess(token) {
    if (window.AndroidBridge && window.AndroidBridge.onToken) {
      window.AndroidBridge.onToken(token);
    }
  }
  function onTurnstileError(code) {
    if (window.AndroidBridge && window.AndroidBridge.onError) {
      window.AndroidBridge.onError(String(code));
    }
  }
  function onTurnstileExpired() {
    if (window.AndroidBridge && window.AndroidBridge.onExpired) {
      window.AndroidBridge.onExpired();
    }
  }
</script>
</body>
</html>
